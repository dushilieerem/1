version: '1.0'
name: svquant-ci
displayName: SVQuant CI（PR / 主干门禁）

# 只读门禁：不改环境、不部署。
# 触发：向 master 发起/更新 PR；合并进 master 的 push。
triggers:
  push:
    branches:
      precise:
        - master
  pr:
    branches:
      precise:
        - master

variables:
  PYTHON_BIN: python3

stages:
  - name: stage-backend
    displayName: 后端门禁
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: shell@agent
        name: backend_check
        displayName: 后端单测（干净 venv + 临时 PostgreSQL）
        # 替换为 Gitee 后台「主机组」里实际的 hostGroupID
        hostGroupID: gitee-go
        script: |
          set -Eeuo pipefail
          ROOT="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
          bash "$ROOT/scripts/ci/backend-check.sh"

  - name: stage-frontend
    displayName: 前端门禁
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: shell@agent
        name: frontend_check
        displayName: 前端构建与单测
        hostGroupID: gitee-go
        script: |
          set -Eeuo pipefail
          ROOT="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
          bash "$ROOT/scripts/ci/frontend-check.sh"

  - name: stage-image
    displayName: 镜像构建校验
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: shell@agent
        name: docker_build
        displayName: 构建前后端镜像（不推送）
        hostGroupID: gitee-go
        script: |
          set -Eeuo pipefail
          # PR 不构建镜像：构建机内存有限，且 PR 阶段 90% 的问题测试阶段就能暴露。
          # 只在合并进 master 后验证 Dockerfile 仍可构建。
          if [ -n "${GITEE_PULL_ID:-}" ]; then
            echo "PR 构建，跳过镜像阶段"
            exit 0
          fi
          if [ "${GITEE_BRANCH:-}" != "master" ]; then
            echo "非 master 分支，跳过镜像阶段"
            exit 0
          fi
          ROOT="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
          bash "$ROOT/scripts/ci/docker-build.sh" "ci-${GITEE_PIPELINE_BUILD_NUMBER:-0}"
