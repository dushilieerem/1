version: '1.0'
name: svquant-release
displayName: SVQuant 发布（tag → 部署 → 冒烟 → 失败回滚）

# 只由 tag 触发：v1.2.3 / v1.2.3-rc1。
# 主线合并只跑 CI；发布必须显式打 tag，保证「部署的版本 = 一个可追溯的 tag」。
triggers:
  push:
    tags:
      prefix:
        - v

stages:
  - name: stage-release
    displayName: 发布
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: shell@agent
        name: deploy
        displayName: 构建镜像 → compose 部署 → 冒烟 → 回滚
        # 替换为 Gitee 后台「主机组」里实际的 hostGroupID（需装 docker + compose v2）
        hostGroupID: gitee-go
        script: |
          set -Eeuo pipefail
          ROOT="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
          TAG="$(git describe --tags --exact-match)"
          echo "发布版本：$TAG"
          bash "$ROOT/scripts/ci/deploy.sh" "$TAG"
