  classic_indicators:
    file: classic_indicators.py
    class: ClassicIndicatorLibrary
    description: 经典日线技术、量价与波动指标
    author: SVQuant
    tags:
    - technical
    - volume_price
    - volatility
    source_snapshot: 用户提供的指标字段与公式表
    verification: implemented
    factor_count: 47
    factors:
    - name: adtm
      description: 动态买卖气指标。
      params:
        window: 23
        smooth: 8
    - name: atr
      description: 真实波幅均值。
      params:
        window: 14
    - name: bbi
      description: 多空指数：四条均线的平均值。
      params:
        short1: 3
        short2: 6
        long1: 12
        long2: 24
    - name: bbiboll
      description: BBI 多空布林线中轨。
      params:
        window: 10
        multiplier: 3.0
    - name: bias
      description: 乖离率。
      params:
        window: 12
    - name: boll
      description: 布林线中轨。
      params:
        window: 26
        multiplier: 2.0
    - name: cci
      description: 顺势指标。
      params:
        window: 14
    - name: cdp
      description: 逆势操作指标中枢 CDP。
    - name: cr
      description: 能量指标。
      params:
        window: 26
    - name: cvlt
      description: 佳庆离散指标。
      params:
        window: 10
    - name: dbcd
      description: 异同离差乖离率 DBCD。
      params:
        bias_window: 5
        lag: 16
        smooth: 76
    - name: ddi
      description: 方向标准差偏离指数 DDI。
      params:
        window: 13
        smooth: 30
        weight: 10
        ma_window: 5
    - name: dma
      description: 平均线差 DDD：短期均线减长期均线。``smooth`` 对应派生线 AMA。
      params:
        short: 10
        long: 50
        smooth: 10
    - name: donchian_position
      description: 唐奇安通道位置：收盘价在近期高低区间中的归一化位置。
      params:
        window: 20
    - name: donchian_width
      description: 唐奇安通道宽度：近期高低区间相对收盘价的幅度。
      params:
        window: 20
    - name: dpo
      description: 区间震荡线：收盘价减移动均线。
      params:
        window: 20
        smooth: 6
    - name: env
      description: ENV 指标中轨。
      params:
        window: 14
        ratio: 0.06
    - name: expma
      description: 指数移动平均。
      params:
        window: 5
    - name: kdj
      description: 随机指标主线 J。
      params:
        window: 9
        k_window: 3
        d_window: 3
    - name: keltner_position
      description: 肯特纳通道位置：收盘价在 EMA/ATR 通道中的归一化位置。
      params:
        window: 20
        atr_window: 10
        multiplier: 2.0
    - name: keltner_width
      description: 肯特纳通道宽度：ATR 通道相对 EMA 中轨的幅度。
      params:
        window: 20
        atr_window: 10
        multiplier: 2.0
    - name: ma
      description: 简单移动平均。
      params:
        window: 5
    - name: macd
      description: MACD 柱值 BAR：2 * (DIF - DEA)。
      params:
        fast: 12
        slow: 26
        signal: 9
    - name: mass
      description: 梅丝线。
      params:
        short: 9
        long: 25
    - name: mfi
      description: 资金流向指标。
      params:
        window: 14
    - name: mi
      description: 动量指标的 SMA 平滑值。
      params:
        window: 12
    - name: mtm
      description: 动力指标 MTM：收盘价与 N 个交易日前收盘价之差。
      params:
        window: 6
        smooth: 5
    - name: priceosc
      description: 价格振荡指标。
      params:
        short: 12
        long: 26
    - name: psy
      description: 心理指标。
      params:
        window: 12
    - name: pvt
      description: 量价趋势指标。
    - name: rc
      description: 变化率指数。
      params:
        window: 50
    - name: roc
      description: 变动速率。
      params:
        window: 12
        smooth: 6
    - name: rsi
      description: Wilder/通达信式相对强弱指标。
      params:
        window: 6
    - name: srdm
      description: 动向速度比率。
      params:
        window: 30
    - name: srmi
      description: SRMI 修正指标。
      params:
        window: 9
    - name: std
      description: 收盘价总体标准差。
      params:
        window: 26
    - name: trix
      description: 三重指数平滑平均的日变动率。
      params:
        window: 12
        smooth: 20
    - name: vhf
      description: 纵横指标。
      params:
        window: 28
    - name: vma
      description: 成交量简单移动平均。
      params:
        window: 5
    - name: vmacd
      description: 成交量 MACD 柱值。
      params:
        fast: 12
        slow: 26
        signal: 9
    - name: vosc
      description: 成交量震荡指标。
      params:
        short: 12
        long: 26
    - name: vr_rate
      description: 成交量比率。
      params:
        window: 26
    - name: vroc
      description: 成交量变动速率。
      params:
        window: 12
    - name: vstd
