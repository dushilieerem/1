# ResearchEngine/app 配置示例
# 正式服务入口：python -m app.main 或 uvicorn app.main:app --workers 1
# 当前部署约束：单实例、单 Worker；WebApp 不在本次重构范围内。

application:
  namespace: app
  api_prefix: /api
  max_workers: 2
  max_queue_size: 8
  factor_backtest_batch_window: 2
  deployment: single-instance-single-worker

assets:
  factor_dir: ./app/assets/factors/libraries
  factor_index: ./app/assets/factors/index.yaml
  strategy_dir: ./app/assets/strategies/libraries
  strategy_index: ./app/assets/strategies/index.yaml

# 数据源：MarketData 目录（一个字段一个 parquet 的宽表面板）
# 指向文件 -> WideCSVProvider；目录含 *.parquet -> FieldParquetProvider；否则逐只 CSV
data_dir: ../MarketData

# 股票池名称（对应 universe.csv 的 pool；无 universe.csv 时用全部标的）
benchmark: CSI500

# 组合构建
rebalance: daily        # daily / weekly / monthly（样本仅 21 天，用 weekly 才有足够调仓点）
stock_num: 100          # 单边最多持仓数（做多 top N / 做空 bottom N；不足时取 min）
n_groups: 5             # 分组评估用（分组 IC 图），不影响买入数
long_short: false       # 是否多空对冲
ic_horizon: 1           # IC 远期收益天数
periods_per_year: 252   # 年化周期数

# 交易成本（供 BacktestEngine 演示使用）
commission: 0.0003
slippage: 0.001

# Native 向量化回测
#   engine: native（自研向量化，与 build_factor_portfolio 逐位等价）
#   成本默认 0 -> 不改默认结果；需要扣成本时设 commission_rate/slippage_rate
backtest:
  engine: native
  initial_capital: 1000000
  # commission_rate: 0.0003
  # slippage_rate: 0.001

# 因子评估增强（默认开启；分层回测/多空/三因子归因/分行业IC/IR，缺数据自动跳过）
#   基准 = 市值加权全市场（自构造，复用 total_mv），三因子 MKT 同源
#   factor_analysis.enabled: false  # 关闭可加速纯回测
#   n_layered_groups: 5             # 分层组数（缺省回落 n_groups）

# 计算后端
compute_backend: python

# 结果存储与输出（大表用 parquet 提速；需要 csv 可改回 csv）
storage: parquet
output_path: ./output/alpha101_result
