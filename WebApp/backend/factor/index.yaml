      explain: 跳空：（开盘价 - 昨收）/ 昨收。
      formula: self.open / self.close.shift(1) - 1
  trading_lib:
    file: trading_lib.py
    class: TradingLib
    description: 量价/资金流类因子
    author: YGQuant
    tags:
    - volume
    - trading
    - moneyflow
    factors:
    - name: volume_5d
      description: 5日均量比
      params:
        window: 5
      tags:
      - volume
      - short_term
      explain: 5 日均量：成交量 / 过去 window 日均量。
      formula: self.volume / self.volume.rolling(window).mean()
    - name: volume_20d
      description: 20日均量比
      params:
        window: 20
      tags:
      - volume
      - mid_term
      explain: 20 日均量。
      formula: self.volume / self.volume.rolling(window).mean()
    - name: volume_60d
      description: 60日均量比
      params:
        window: 60
      tags:
      - volume
      - long_term
      explain: 60 日均量。
      formula: self.volume / self.volume.rolling(window).mean()
    - name: volume_std
      description: 成交量波动ZSCORE
      params:
        window: 20
      tags:
      - volume
      - volatility
      explain: 成交量波动：成交量的 ZSCORE。
      formula: (vol - vol.rolling(window).mean()) / vol.rolling(window).std()
    - name: volume_shock
      description: 成交量突变
      params:
        window: 5
      tags:
      - volume
      - shock
      explain: 成交量突变：当日量 / 前 window 日最小量。
      formula: self.volume / self.volume.rolling(window).min()
    - name: amount_5d
      description: 5日成交额比
      params:
        window: 5
      tags:
      - amount
      - short_term
      explain: 5 日成交额比。
      formula: self.amount / self.amount.rolling(window).mean()
    - name: amount_20d
      description: 20日成交额比
      params:
        window: 20
      tags:
      - amount
      - mid_term
      explain: 20 日成交额比。
      formula: self.amount / self.amount.rolling(window).mean()
    - name: turnover_5d
      description: 5日平均换手率
      params:
        window: 5
      tags:
      - turnover
      - short_term
      explain: 5 日平均换手率。
      formula: self.turnover.rolling(window).mean()
    - name: turnover_20d
      description: 20日平均换手率
      params:
        window: 20
      tags:
      - turnover
      - mid_term
      explain: 20 日平均换手率。
      formula: self.turnover.rolling(window).mean()
    - name: turnover_std
      description: 换手率波动
      params:
        window: 20
      tags:
      - turnover
      - volatility
      explain: 换手率波动。
      formula: self.turnover.rolling(window).std()
    - name: volume_price_corr
      description: 量价相关性：成交与价格的相关系数
      params:
        window: 10
      tags:
      - volume
      - price
      - correlation
      explain: 量价相关性：成交量和价格的相关系数。
      formula: ret.rolling(window).corr(vol)
    - name: volume_confirmation
      description: 量能确认：涨放量跌缩量
      params:
        window: 5
      tags:
      - volume
      - price
      - confirmation
      explain: 量能确认：上涨时放量，下跌时缩量。
      formula: ret * vol_ratio
    - name: volume_price_trend
      description: 量价趋势：价格×量能
      params:
        window: 20
      tags:
      - volume
      - price
      - trend
      explain: 量价趋势：价格趋势 × 量能趋势。
      formula: price_trend * vol_trend
    - name: volume_divergence
      description: 量价背离：价创新高量没跟上
      params:
        window: 10
      tags:
      - volume
      - price
      - divergence
      explain: 量价背离：价格创新高但量能没跟上。
      formula: (price_high.astype(float) * (1 - vol_avg)) * (-1)
    - name: money_flow
      description: 资金流：价格变动×成交量
      params:
        window: 5
      tags:
      - moneyflow
      explain: 资金流：价格变动 × 成交量。
      formula: (ret * self.volume).rolling(window).sum()
    - name: net_buy_ratio
      description: 净买入比
      params:
        window: 5
      tags:
      - moneyflow
      explain: 净买入比。
      formula: (buy_sum - sell_sum) / (buy_sum + sell_sum + 1e-10)
