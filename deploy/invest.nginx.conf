# Invest H5 + API 的 Nginx 参考配置
# 用法：替换域名/证书/路径；H5 与 API 同源，避免 CORS。
#
# 注意：公开运行前必须完成 ICP、隐私政策、数据源条款与安全加固。

upstream invest_api {
    server 127.0.0.1:8767;
    keepalive 16;
}

server {
    listen 80;
    server_name m.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name m.example.com;

    ssl_certificate     /etc/letsencrypt/live/m.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/m.example.com/privkey.pem;

    root /srv/svquant/invest-h5;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://invest_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }

    # 公开前建议关闭 docs；如保留，加 IP 白名单/鉴权
    location ~ ^/(docs|openapi.json|redoc) {
        return 404;
    }

    # 数据/备份文件不可公网访问
    location ~* \.(db|sqlite|bak)$ {
        return 404;
    }
}
