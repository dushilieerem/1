# SVQuant 主前端 Nginx 配置（容器内部，:80）
# 对外 TLS/域名由宿主机 Nginx 或网关终止，本文件只处理静态资源与 /api 反代。
# 需要 HTTPS 直连时，另拷一份并补 ssl_certificate 配置，不要改这里。

upstream svquant_api {
    server backend:8766;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 容器健康检查端点，不写访问日志
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA 路由回退；index.html 不缓存，避免发版后浏览器拿到旧壳
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 后端 API：长回测会超过默认 60s，超时对齐 backend 的 1800s
    location /api/ {
        proxy_pass http://svquant_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        client_max_body_size 20m;
    }

    # 生产不对外暴露 OpenAPI 文档
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    location ~* \.(db|sqlite|bak|log)$ {
        return 404;
    }
}
