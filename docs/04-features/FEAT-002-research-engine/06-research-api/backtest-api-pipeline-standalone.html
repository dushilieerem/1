:root[data-theme=&quot;light&quot;] {

* {

}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

  padding: 5px;

  background: transparent !important;

  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);

  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;

h2,
h3,
h4,
h5,
h6,

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {

}

code:not(pre code) {

  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);

  font-family: var(--font-mono);

}

.table-responsive {

  overflow-x: auto;

}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {

  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {

}

}

.table :is(.text-center, [align=&quot;center&quot;]) {

}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {

  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;

  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);

.text-small,
.viz-badge {

  line-height: var(--line-height-small);
}

.text-muted {

}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {

  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;

.btn,
.form-check-input,
.form-control,
.form-range,

}

.btn {

  display: inline-flex;

  min-height: 28px;
  align-items: center;

}

  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);

}

  color: var(--muted-foreground);

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);

  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {

  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);

  color: var(--foreground);

.form-select:focus-visible {

.form-check {

.form-check-input {

  width: 14px;
  height: 14px;

  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);

  transition:

  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;body&gt;
&lt;div id=&quot;svquant-pipeline&quot; aria-labelledby=&quot;pipeline-title&quot;&gt;
  &lt;style&gt;
    #svquant-pipeline {
      --background: light-dark(rgb(250 251 252), rgb(20 23 28));
      --foreground: light-dark(rgb(28 35 42), rgb(235 240 244));
      --muted-foreground: light-dark(rgb(89 103 115), rgb(164 177 188));
      --border: light-dark(rgb(211 220 226), rgb(65 77 88));
      --card: light-dark(rgb(255 255 255), rgb(30 35 42));
      --card-foreground: light-dark(rgb(28 35 42), rgb(235 240 244));
      --popover: light-dark(rgb(255 255 255), rgb(30 35 42));
      --popover-foreground: light-dark(rgb(28 35 42), rgb(235 240 244));
      --primary: light-dark(rgb(21 93 137), rgb(111 191 241));
      --primary-foreground: light-dark(rgb(255 255 255), rgb(15 31 42));
      --accent: light-dark(rgb(231 241 248), rgb(31 57 72));
      --accent-foreground: light-dark(rgb(21 73 104), rgb(207 232 246));
      --viz-series-1: light-dark(rgb(22 107 154), rgb(112 195 242));
      --viz-series-2: light-dark(rgb(36 133 102), rgb(103 205 166));
      --viz-series-3: light-dark(rgb(189 116 28), rgb(239 180 92));
      --viz-series-4: light-dark(rgb(137 78 168), rgb(205 144 230));
      --viz-series-5: light-dark(rgb(187 63 78), rgb(239 130 143));
      --viz-series-6: light-dark(rgb(84 98 112), rgb(168 182 194));
      color: var(--foreground);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      max-width: 1160px;
      margin: 0 auto;
      padding: 24px;
    }

    #svquant-pipeline * {
      box-sizing: border-box;
    }

    #svquant-pipeline h1,
    #svquant-pipeline h2,
    #svquant-pipeline h3,
    #svquant-pipeline p {
      margin: 0;
    }

    #svquant-pipeline code {
      color: var(--accent-foreground);
      font-family: ui-monospace, SFMono-Regular, Consolas, &quot;Liberation Mono&quot;, monospace;
      font-size: 0.9em;
      overflow-wrap: anywhere;
    }

    #svquant-pipeline .eyebrow {
      color: var(--muted-foreground);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    #svquant-pipeline .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    #svquant-pipeline h1 {
      font-size: clamp(22px, 3vw, 32px);
      font-weight: 500;
      letter-spacing: -0.025em;
    }

    #svquant-pipeline .subtitle {
      color: var(--muted-foreground);
      margin-top: 6px;
    }

    #svquant-pipeline .endpoint {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--primary);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 12px;
      white-space: nowrap;
    }

    #svquant-pipeline .endpoint::before {
      content: &quot;POST&quot;;
      border: 1px solid color-mix(in srgb, var(--primary) 45%, transparent);
      border-radius: 3px;
      color: var(--primary);
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.04em;
      padding: 2px 5px;
    }

    #svquant-pipeline .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px 18px;
      padding: 16px 0 12px;
    }

    #svquant-pipeline .control-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    #svquant-pipeline .control-label {
      color: var(--muted-foreground);
      font-size: 12px;
      margin-right: 4px;
    }

    #svquant-pipeline .control-button {
      appearance: none;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--muted-foreground);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      padding: 6px 9px;
    }

    #svquant-pipeline .control-button:hover,
    #svquant-pipeline .control-button:focus-visible {
      border-color: var(--primary);
      color: var(--foreground);
      outline: 2px solid color-mix(in srgb, var(--primary) 35%, transparent);
      outline-offset: 2px;
    }

    #svquant-pipeline .control-button[aria-pressed=&quot;true&quot;] {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--primary-foreground);
    }

    #svquant-pipeline .profile-note {
      color: var(--muted-foreground);
      font-size: 12px;
    }

    #svquant-pipeline .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(300px, 0.8fr);
      gap: 28px;
      align-items: start;
    }

    #svquant-pipeline .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin: 8px 0 12px;
    }

    #svquant-pipeline .section-head h2 {
      font-size: 15px;
      font-weight: 500;
    }

    #svquant-pipeline .section-head span {
      color: var(--muted-foreground);
      font-size: 12px;
    }

    #svquant-pipeline .flow {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    #svquant-pipeline .stage {
      --tone: var(--viz-series-6);
      appearance: none;
      background: color-mix(in srgb, var(--card) 82%, transparent);
      border: 1px solid var(--border);
      border-left: 4px solid var(--tone);
      border-radius: 5px;
      color: var(--card-foreground);
      cursor: pointer;
      display: block;
      padding: 12px 14px;
      text-align: left;
      transition: border-color 140ms ease, background 140ms ease, transform 140ms ease;
      width: 100%;
    }

    #svquant-pipeline .stage:hover,
    #svquant-pipeline .stage:focus-visible,
    #svquant-pipeline .stage.is-active {
      background: color-mix(in srgb, var(--accent) 72%, var(--card));
      border-color: color-mix(in srgb, var(--tone) 55%, var(--border));
      outline: 2px solid color-mix(in srgb, var(--tone) 30%, transparent);
      outline-offset: 2px;
      transform: translateX(2px);
    }

    #svquant-pipeline .stage[data-tone=&quot;request&quot;] { --tone: var(--viz-series-1); }
    #svquant-pipeline .stage[data-tone=&quot;cache&quot;] { --tone: var(--viz-series-4); }
    #svquant-pipeline .stage[data-tone=&quot;data&quot;] { --tone: var(--viz-series-2); }
    #svquant-pipeline .stage[data-tone=&quot;factor&quot;] { --tone: var(--viz-series-3); }
    #svquant-pipeline .stage[data-tone=&quot;backtest&quot;] { --tone: var(--viz-series-1); }
    #svquant-pipeline .stage[data-tone=&quot;metric&quot;] { --tone: var(--viz-series-5); }
    #svquant-pipeline .stage[data-tone=&quot;analysis&quot;] { --tone: var(--viz-series-4); }
    #svquant-pipeline .stage[data-tone=&quot;response&quot;] { --tone: var(--viz-series-2); }

    #svquant-pipeline .stage-top {
      display: flex;
      align-items: baseline;
      gap: 9px;
    }

    #svquant-pipeline .stage-number {
      color: var(--tone);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 11px;
      font-weight: 500;
    }

    #svquant-pipeline .stage-title {
      font-size: 15px;
      font-weight: 500;
    }

    #svquant-pipeline .stage-caption {
      color: var(--muted-foreground);
      font-size: 12px;
      margin-top: 4px;
    }

    #svquant-pipeline .stage-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 9px;
    }

    #svquant-pipeline .tag {
      border: 1px solid color-mix(in srgb, var(--tone) 35%, var(--border));
      border-radius: 3px;
      color: var(--muted-foreground);
      font-size: 10px;
      padding: 2px 5px;
    }

    #svquant-pipeline .connector {
      align-items: center;
      color: var(--muted-foreground);
      display: flex;
      height: 25px;
      justify-content: center;
      position: relative;
    }

    #svquant-pipeline .connector::before {
      background: var(--border);
      content: &quot;&quot;;
      height: 100%;
      position: absolute;
      width: 1px;
    }

    #svquant-pipeline .connector span {
      background: var(--background);
      font-size: 13px;
      line-height: 1;
      padding: 3px 5px;
      position: relative;
    }

    #svquant-pipeline .detail-panel,
    #svquant-pipeline .timing-panel {
      border-top: 2px solid var(--primary);
      padding: 14px 0 18px;
    }

    #svquant-pipeline .detail-kicker {
      color: var(--muted-foreground);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    #svquant-pipeline .detail-title {
      font-size: 20px;
      font-weight: 500;
      margin-top: 4px;
    }

    #svquant-pipeline .detail-file {
      color: var(--accent-foreground);
      font-size: 11px;
      margin-top: 8px;
    }

    #svquant-pipeline .detail-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-top: 18px;
    }

    #svquant-pipeline .detail-block {
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }

    #svquant-pipeline .detail-label {
      color: var(--muted-foreground);
      font-size: 11px;
      margin-bottom: 4px;
    }

    #svquant-pipeline .detail-value {
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    #svquant-pipeline .detail-description {
      border-top: 1px solid var(--border);
      font-size: 13px;
      margin-top: 18px;
      padding-top: 12px;
    }

    #svquant-pipeline .timing-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    #svquant-pipeline .timing-head h2 {
      font-size: 15px;
      font-weight: 500;
    }

    #svquant-pipeline .timing-total {
      color: var(--primary);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 12px;
    }

    #svquant-pipeline .timing-subtitle {
      color: var(--muted-foreground);
      font-size: 11px;
      margin-top: 4px;
    }

    #svquant-pipeline .timing-list {
      margin-top: 15px;
    }

    #svquant-pipeline .timing-row {
      display: grid;
      grid-template-columns: 115px minmax(0, 1fr) 55px;
      align-items: center;
      gap: 8px;
      margin-top: 9px;
    }

    #svquant-pipeline .timing-name,
    #svquant-pipeline .timing-value {
      font-size: 11px;
    }

    #svquant-pipeline .timing-value {
      color: var(--muted-foreground);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      text-align: right;
    }

    #svquant-pipeline .timing-track {
      background: color-mix(in srgb, var(--border) 55%, transparent);
      height: 6px;
      overflow: hidden;
    }

    #svquant-pipeline .timing-bar {
      background: var(--viz-series-1);
      height: 100%;
      min-width: 3px;
      transition: width 220ms ease;
    }

    #svquant-pipeline .timing-row[data-key=&quot;metric_calculation&quot;] .timing-bar {
      background: var(--viz-series-5);
    }

    #svquant-pipeline .timing-row[data-key=&quot;factor_compute&quot;] .timing-bar {
      background: var(--viz-series-3);
    }

    #svquant-pipeline .timing-row[data-key=&quot;engine_setup&quot;] .timing-bar,
    #svquant-pipeline .timing-row[data-key=&quot;panel_setup&quot;] .timing-bar {
      background: var(--viz-series-2);
    }

    #svquant-pipeline .timing-foot {
      color: var(--muted-foreground);
      font-size: 11px;
      margin-top: 14px;
    }

    #svquant-pipeline .branch-section,
    #svquant-pipeline .data-section,
    #svquant-pipeline .error-section {
      border-top: 1px solid var(--border);
      margin-top: 20px;
      padding-top: 16px;
    }

    #svquant-pipeline .branch-section h2,
    #svquant-pipeline .data-section h2,
    #svquant-pipeline .error-section h2 {
      font-size: 14px;
      font-weight: 500;
    }

    #svquant-pipeline .branch-grid,
    #svquant-pipeline .data-grid {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-top: 11px;
    }

    #svquant-pipeline .branch,
    #svquant-pipeline .data-lane,
    #svquant-pipeline .error-lane {
      border-left: 3px solid var(--viz-series-6);
      padding: 9px 11px;
    }

    #svquant-pipeline .branch[data-branch=&quot;core&quot;] {
      border-left-color: var(--viz-series-1);
    }

    #svquant-pipeline .branch[data-branch=&quot;full&quot;] {
      border-left-color: var(--viz-series-4);
    }

    #svquant-pipeline .branch.is-muted {
      opacity: 0.42;
    }

    #svquant-pipeline .branch-title,
    #svquant-pipeline .data-title,
    #svquant-pipeline .error-title {
      font-size: 12px;
      font-weight: 500;
    }

    #svquant-pipeline .branch-copy,
    #svquant-pipeline .data-copy,
    #svquant-pipeline .error-copy {
      color: var(--muted-foreground);
      font-size: 11px;
      margin-top: 4px;
    }

    #svquant-pipeline .data-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    #svquant-pipeline .data-lane:nth-child(1) { border-left-color: var(--viz-series-3); }
    #svquant-pipeline .data-lane:nth-child(2) { border-left-color: var(--viz-series-2); }
    #svquant-pipeline .data-lane:nth-child(3) { border-left-color: var(--viz-series-1); }

    #svquant-pipeline .error-lane {
      border-left-color: var(--viz-series-5);
      margin-top: 10px;
    }

    @media (max-width: 820px) {
      #svquant-pipeline .layout {
        grid-template-columns: 1fr;
      }

      #svquant-pipeline .detail-panel,
      #svquant-pipeline .timing-panel {
        margin-top: 4px;
      }
    }

    @media (max-width: 560px) {
      #svquant-pipeline {
        padding: 16px;
      }

      #svquant-pipeline .header {
        display: block;
      }

      #svquant-pipeline .endpoint {
        margin-top: 13px;
      }

      #svquant-pipeline .detail-grid,
      #svquant-pipeline .branch-grid,
      #svquant-pipeline .data-grid {
        grid-template-columns: 1fr;
      }

      #svquant-pipeline .timing-row {
        grid-template-columns: 100px minmax(0, 1fr) 48px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #svquant-pipeline .stage,
      #svquant-pipeline .timing-bar {
        transition: none;
      }
    }
  &lt;/style&gt;

          subtitle: &quot;短区间 BIAS · schema 缓存已生效 · core · 关闭结果缓存&quot;,
          total: 10.766967,
          timings: {
            engine_setup: 2.41852,
            panel_setup: 4.493104,
            factor_compute: 2.645267,
            signal_and_backtest: 0.710764,
            metric_calculation: 0.05649,
            factor_analysis: 0.173238
          }
        }
      };

      const labels = {
        engine_setup: &quot;引擎初始化&quot;,
        panel_setup: &quot;面板准备&quot;,
        factor_compute: &quot;因子计算&quot;,
        signal_and_backtest: &quot;信号 + 回测&quot;,
        metric_calculation: &quot;指标计算&quot;,
        factor_analysis: &quot;因子分析&quot;
      };

      const stageButtons = [...root.querySelectorAll(&quot;.stage&quot;)];
      const modeButtons = [...root.querySelectorAll(&quot;[data-mode]&quot;)];
      const profileButtons = [...root.querySelectorAll(&quot;[data-profile]&quot;)];
      const detailKicker = root.querySelector(&quot;#detail-kicker&quot;);
      const detailTitle = root.querySelector(&quot;#detail-title&quot;);
      const detailFile = root.querySelector(&quot;#detail-file&quot;);
      const detailInput = root.querySelector(&quot;#detail-input&quot;);
      const detailOutput = root.querySelector(&quot;#detail-output&quot;);
      const detailDescription = root.querySelector(&quot;#detail-description&quot;);
      const analysisCaption = root.querySelector(&quot;#analysis-caption&quot;);
      const analysisTag = root.querySelector(&quot;#analysis-tag&quot;);
      const profileNote = root.querySelector(&quot;#profile-note&quot;);
      const timingSubtitle = root.querySelector(&quot;#timing-subtitle&quot;);
      const timingTotal = root.querySelector(&quot;#timing-total&quot;);
      const timingList = root.querySelector(&quot;#timing-list&quot;);

      let activeMode = &quot;core&quot;;
      let activeProfile = &quot;macd&quot;;

      function selectStage(key) {
        const detail = details[key];
        if (!detail) return;
        stageButtons.forEach((button) =&gt; {
          const active = button.dataset.stage === key;
          button.classList.toggle(&quot;is-active&quot;, active);
          button.setAttribute(&quot;aria-pressed&quot;, String(active));
        });
        detailKicker.textContent = detail.kicker;
        detailTitle.textContent = detail.title;
        detailFile.innerHTML = `&lt;code&gt;${detail.file}&lt;/code&gt;`;
        detailInput.textContent = detail.input;
        detailOutput.textContent = detail.output;
        detailDescription.textContent = detail.description;
      }

      function updateMode() {
        modeButtons.forEach((button) =&gt; {
          button.setAttribute(&quot;aria-pressed&quot;, String(button.dataset.mode === activeMode));
        });
        const full = activeMode === &quot;full&quot;;
        analysisCaption.textContent = full
          ? &quot;full：分组收益与净值，并增加 IC、行业、FF3、多空和基准分析&quot;
          : &quot;core：分组收益与分组净值；不执行完整行业和 FF3 诊断&quot;;
        analysisTag.textContent = full ? &quot;full active&quot; : &quot;core active&quot;;
        root.querySelectorAll(&quot;.branch&quot;).forEach((branch) =&gt; {
          branch.classList.toggle(&quot;is-muted&quot;, branch.dataset.branch !== activeMode);
        });
      }

      function updateProfile() {
        const profile = profiles[activeProfile];
        const values = Object.values(profile.timings);
        const max = Math.max(...values);
        profileNote.textContent = profile.note;
        timingSubtitle.textContent = profile.subtitle;
        timingTotal.textContent = `api_total ${profile.total.toFixed(2)} s`;
        timingList.innerHTML = Object.entries(profile.timings).map(([key, value]) =&gt; {
          const width = Math.max(3, (value / max) * 100);
          return `&lt;div class=&quot;timing-row&quot; data-key=&quot;${key}&quot;&gt;
            &lt;div class=&quot;timing-name&quot;&gt;${labels[key]}&lt;/div&gt;
            &lt;div class=&quot;timing-track&quot; aria-hidden=&quot;true&quot;&gt;&lt;div class=&quot;timing-bar&quot; style=&quot;width:${width.toFixed(2)}%&quot;&gt;&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;timing-value&quot;&gt;${value.toFixed(2)} s&lt;/div&gt;
          &lt;/div&gt;`;
        }).join(&quot;&quot;);
      }

      stageButtons.forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; selectStage(button.dataset.stage));
      });
      modeButtons.forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          activeMode = button.dataset.mode;
          updateMode();
        });
      });
      profileButtons.forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          activeProfile = button.dataset.profile;
          profileButtons.forEach((item) =&gt; {
            item.setAttribute(&quot;aria-pressed&quot;, String(item === button));
          });
          updateProfile();
        });
      });

      selectStage(&quot;request&quot;);
      updateMode();
      updateProfile();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {

    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
