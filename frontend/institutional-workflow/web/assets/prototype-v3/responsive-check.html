&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;div id=&quot;app&quot;&gt;&lt;main class=&quot;main&quot;&gt;&lt;h1&gt;SVQuant · 机构量化&lt;/h1&gt;&lt;p&gt;正在打开交互原型…&lt;/p&gt;&lt;/main&gt;&lt;/div&gt;&lt;dialog id=&quot;modal&quot;&gt;&lt;/dialog&gt;&lt;div id=&quot;toast&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;noscript&gt;请启用JavaScript以使用原型；产品需求文档可单独阅读。&lt;/noscript&gt;&lt;script id=&quot;blueprint&quot; type=&quot;application/json&quot;&gt;{&quot;title&quot;:&quot;SVQuant 机构版 · 业务流程与 Agent 职责拆解&quot;,&quot;version&quot;:&quot;设计评审 V2 · 2026-11-04&quot;,&quot;status&quot;:&quot;目标设计，尚未按本稿改造运行系统&quot;,&quot;roles&quot;:{&quot;D-A1&quot;:{&quot;name&quot;:&quot;数据接入 Agent&quot;,&quot;short&quot;:&quot;数据接入&quot;,&quot;mission&quot;:&quot;把研究需求转成可执行的取数计划，选择已授权来源并处理采集异常。&quot;,&quot;tools&quot;:&quot;数据目录、来源授权查询、连接测试、采集/补采、任务状态、原始批次登记&quot;,&quot;output&quot;:&quot;需求与采集计划、原始批次、异常记录&quot;,&quot;boundary&quot;:&quot;不能自行购买数据、配置凭证或扩大来源授权；按配额重试。&quot;,&quot;evaluation&quot;:&quot;需求字段覆盖、采集成功率、重复批次率、异常定位与恢复成本&quot;},&quot;D-A2&quot;:{&quot;name&quot;:&quot;数据加工 Agent&quot;,&quot;short&quot;:&quot;数据加工&quot;,&quot;mission&quot;:&quot;生成并试运行清洗、标准化和文本抽取规则，检查加工前后差异。&quot;,&quot;tools&quot;:&quot;字段映射、规则编辑/试跑、单位转换、去重、实体匹配、文档与事件抽取、差异预览&quot;,&quot;output&quot;:&quot;标准数据、结构化事件、加工规则版本、证据引用&quot;,&quot;boundary&quot;:&quot;原始数据不可覆盖；缺失数值不得凭空补造；大范围规则变更须复核。&quot;,&quot;evaluation&quot;:&quot;字段转换准确率、实体/事件抽取准确率、时点错误率、人工纠错率&quot;},&quot;D-A3&quot;:{&quot;name&quot;:&quot;数据质量 Agent&quot;,&quot;short&quot;:&quot;质量核验&quot;,&quot;mission&quot;:&quot;解释独立质量检查结果，定位质量与历史可用时点问题，提出隔离或补采建议。&quot;,&quot;tools&quot;:&quot;质量规则引擎、跨源对照、时间戳核验、异常样本查询、影响分析&quot;,&quot;output&quot;:&quot;质量报告、异常清单、发布检查结论&quot;,&quot;boundary&quot;:&quot;不能为放行修改检查结果或擅自降低阈值；与加工任务隔离写权限。&quot;,&quot;evaluation&quot;:&quot;异常检出与误报率、时间穿越问题发现率、报告与原始检查一致性&quot;},&quot;D-A4&quot;:{&quot;name&quot;:&quot;数据发布与维护 Agent&quot;,&quot;short&quot;:&quot;发布维护&quot;,&quot;mission&quot;:&quot;组织数据版本发布、服务检查和更新维护，跟踪修订影响。&quot;,&quot;tools&quot;:&quot;版本登记/发布、血缘查询、更新监测、修复工单、版本切换与回滚申请&quot;,&quot;output&quot;:&quot;可查询版本、数据说明、更新与修订记录&quot;,&quot;boundary&quot;:&quot;只发布通过规则且满足授权的数据；历史版本不可静默改写。&quot;,&quot;evaluation&quot;:&quot;发布可复现性、更新及时性、血缘完整度、修订通知与恢复时效&quot;},&quot;F-A1&quot;:{&quot;name&quot;:&quot;因子研究 Agent&quot;,&quot;short&quot;:&quot;因子研究&quot;,&quot;mission&quot;:&quot;检索已有研究，提出可检验的因子假设、候选定义与实验计划。&quot;,&quot;tools&quot;:&quot;因子库/失败实验检索、授权文献与知识检索、字段目录、假设与计划编辑&quot;,&quot;output&quot;:&quot;复用建议、假设卡、候选表达式、验证计划&quot;,&quot;boundary&quot;:&quot;不能把相关性说成因果证明；不能读取封存验证区来指导选题。&quot;,&quot;evaluation&quot;:&quot;假设可检验性、资产复用率、无效重复率、后续实验与假设一致性&quot;},&quot;F-A2&quot;:{&quot;name&quot;:&quot;因子实验 Agent&quot;,&quot;short&quot;:&quot;因子实验&quot;,&quot;mission&quot;:&quot;实现、计算和检验因子，依据研发数据中的反馈进行有预算的修正。&quot;,&quot;tools&quot;:&quot;表达式/代码校验、受限执行环境、因子计算、预处理、IC/分层/分段检验、成本与相关性分析、实验对比&quot;,&quot;output&quot;:&quot;版本化定义、因子值、研发检验报告、全部尝试记录&quot;,&quot;boundary&quot;:&quot;只使用获准数据和工具；不能自行更改验收门槛、封存区或无限试参。&quot;,&quot;evaluation&quot;:&quot;实现正确率、复现率、错误修复率、单位有效实验成本、证据完整度&quot;},&quot;F-A3&quot;:{&quot;name&quot;:&quot;因子资产 Agent&quot;,&quot;short&quot;:&quot;因子资产&quot;,&quot;mission&quot;:&quot;整理冻结候选、因子卡和证据包，管理复用、准入状态、衰减与停用。&quot;,&quot;tools&quot;:&quot;候选冻结、血缘与证据核验、相似性检索、因子登记、送审、状态与版本管理&quot;,&quot;output&quot;:&quot;因子卡、冻结候选、分级因子库、生命周期记录&quot;,&quot;boundary&quot;:&quot;不能把研究留档改成正式准入；不可替代独立验证或人工签署。&quot;,&quot;evaluation&quot;:&quot;资产元数据完整度、重复候选拦截率、证据关联准确率、状态流转正确率&quot;},&quot;S-A1&quot;:{&quot;name&quot;:&quot;策略设计 Agent&quot;,&quot;short&quot;:&quot;策略设计&quot;,&quot;mission&quot;:&quot;把研究目标转成信号、模型、持仓和交易规则，选择已有数据及因子。&quot;,&quot;tools&quot;:&quot;数据/因子/策略库检索、研究计划、规则编辑器、模型方案与基准配置&quot;,&quot;output&quot;:&quot;研究方案、策略规格、信号与规则草案&quot;,&quot;boundary&quot;:&quot;因子、预测信号与持仓规则须分别说明；不能承诺收益或忽略交易约束。&quot;,&quot;evaluation&quot;:&quot;规格完整度、规则可执行性、约束遗漏率、目标与验证方案一致性&quot;},&quot;S-A2&quot;:{&quot;name&quot;:&quot;策略开发与实验 Agent&quot;,&quot;short&quot;:&quot;策略实验&quot;,&quot;mission&quot;:&quot;实现策略或训练管线，运行回测、诊断问题并进行有限优化。&quot;,&quot;tools&quot;:&quot;策略配置/受限代码、训练任务、回测、成交/成本模型、滚动开发验证、参数试验、报告对比&quot;,&quot;output&quot;:&quot;可运行策略版本、模型产物、回测与优化记录&quot;,&quot;boundary&quot;:&quot;不能访问封存验证数据进行调参；训练、信号和交易时间必须一致。&quot;,&quot;evaluation&quot;:&quot;执行正确率、复现率、时间泄漏检出、错误修复质量、实验资源效率&quot;},&quot;S-A3&quot;:{&quot;name&quot;:&quot;策略跟踪与准入 Agent&quot;,&quot;short&quot;:&quot;跟踪准入&quot;,&quot;mission&quot;:&quot;跟踪冻结版本的模拟运行，核对回测偏差，组织策略准入和版本维护。&quot;,&quot;tools&quot;:&quot;模拟部署申请、信号/模拟成交账本、偏差对比、策略卡、证据核对、送审与状态管理&quot;,&quot;output&quot;:&quot;模拟跟踪报告、策略卡、准入申请、策略库版本&quot;,&quot;boundary&quot;:&quot;模拟不等于实盘；策略研究准入不等于获准使用账户资金。&quot;,&quot;evaluation&quot;:&quot;偏差解释与证据一致性、运行故障检出、策略卡完整度、准入记录正确性&quot;},&quot;P-A1&quot;:{&quot;name&quot;:&quot;组合配置 Agent&quot;,&quot;short&quot;:&quot;组合配置&quot;,&quot;mission&quot;:&quot;在已确认的目标和预算内选择策略，分析穿透敞口并比较配置方案。&quot;,&quot;tools&quot;:&quot;策略筛选、持仓穿透、相关性/集中度、风险与容量计算、约束优化、压力情景、方案比较&quot;,&quot;output&quot;:&quot;候选策略、组合权重、风险与情景报告、再平衡建议&quot;,&quot;boundary&quot;:&quot;不可扩大资金授权、抬高风险限额或把不同策略名称当作分散证明。&quot;,&quot;evaluation&quot;:&quot;约束满足率、暴露计算一致性、方案复现性、解释与优化结果一致性&quot;},&quot;P-A2&quot;:{&quot;name&quot;:&quot;投资方案与审批协同 Agent&quot;,&quot;short&quot;:&quot;方案协同&quot;,&quot;mission&quot;:&quot;整理配置方案、风险意见和授权材料，跟踪审批、退回与变更。&quot;,&quot;tools&quot;:&quot;投资方案编辑、授权矩阵查询、风险检查申请、审批流转、版本差异与证据包&quot;,&quot;output&quot;:&quot;待审方案、审批快照、部署或变更交接单&quot;,&quot;boundary&quot;:&quot;只能组织和流转，不能代签、绕过否决或把旧批准用于已变更方案。&quot;,&quot;evaluation&quot;:&quot;材料完整度、授权匹配正确率、批准版本一致性、退回闭环时效&quot;},&quot;P-A3&quot;:{&quot;name&quot;:&quot;部署执行与对账 Agent&quot;,&quot;short&quot;:&quot;执行对账&quot;,&quot;mission&quot;:&quot;把已获授权的版本与计划交给部署/执行服务，核对运行和成交回报。&quot;,&quot;tools&quot;:&quot;模拟/实盘部署接口、授权计划校验、执行状态查询、成交与持仓对账、暂停申请&quot;,&quot;output&quot;:&quot;部署记录、执行回执、对账差异、异常工单&quot;,&quot;boundary&quot;:&quot;不持有可绕过执行服务的交易权限；不能自行加仓、改方向或重复提交未决订单。&quot;,&quot;evaluation&quot;:&quot;版本与授权一致性、重复执行拦截、回报完整度、对账差异发现与闭环率&quot;},&quot;T-A1&quot;:{&quot;name&quot;:&quot;运行监测 Agent&quot;,& try&quot;:&quot;业务人员改进建议、重复失败、工具升级或模型/方法变更；运行计划也在此管理。&quot;,&quot;feedback&quot;:&quot;在线反馈进入经审核的评测集；新版本通过评测和授权发布后才能替换线上方法。&quot;,&quot;gate_note&quot;:&quot;职责划分：岗位人员维护草案和知识；平台团队负责工具、权限、评测与发布。&quot;,&quot;loop_note&quot;:&quot;不新增必需Agent：T-A2可辅助整理失败样本；权限、测试和发布由人及程序负责。&quot;,&quot;stages&quot;:[{&quot;id&quot;:&quot;M1&quot;,&quot;name&quot;:&quot;角色、工具与运行政策&quot;,&quot;label&quot;:&quot;平台管理员＋配置服务&quot;,&quot;roles&quot;:[],&quot;features&quot;:[&quot;职责、输入输出与工具&quot;,&quot;读写权限与危险动作边界&quot;,&quot;任务触发、计划和队列&quot;,&quot;费用、并发与停止条件&quot;],&quot;output&quot;:&quot;角色配置、工具权限、运行政策。&quot;,&quot;manual&quot;:&quot;配置角色、工具白名单、计划、预算、并发、暂停和停止。&quot;,&quot;ai&quot;:&quot;可解释配置，不自行扩权或提高预算。&quot;},{&quot;id&quot;:&quot;M2&quot;,&quot;name&quot;:&quot;方法与知识维护&quot;,&quot;label&quot;:&quot;业务人员＋平台团队&quot;,&quot;roles&quot;:[],&quot;features&quot;:[&quot;Prompt 与 Skill 草案&quot;,&quot;共享 Skill 库与版本&quot;,&quot;知识来源、时效和访问权&quot;,&quot;工具和模型依赖版本&quot;],&quot;output&quot;:&quot;可审查的方法/知识候选版本。&quot;,&quot;manual&quot;:&quot;编辑、试用、分享、提交改进；维护知识来源和权限。&quot;,&quot;ai&quot;:&quot;通用助手可辅助写草案；发布权限与使用权限分开。&quot;},{&quot;id&quot;:&quot;M3&quot;,&quot;name&quot;:&quot;样本整理与离线评测&quot;,&quot;label&quot;:&quot;T-A2 辅助＋评测服务&quot;,&quot;roles&quot;:[&quot;T-A2&quot;],&quot;features&quot;:[&quot;人工纠错和失败样本&quot;,&quot;任务成功、正确与越权&quot;,&quot;成本、延迟和复现检查&quot;,&quot;必要时实验微调方案&quot;],&quot;output&quot;:&quot;审核后的评测样本与结果。&quot;,&quot;manual&quot;:&quot;标注/审核样本，配置评测，发起离线测试；必要时开展独立训练实验。&quot;,&quot;ai&quot;:&quot;T-A2整理已有失败证据；标准答案需审核，测试和训练数据隔离。&quot;},{&quot;id&quot;:&quot;M4&quot;,&quot;name&quot;:&quot;版本比较与发布审查&quot;,&quot;label&quot;:&quot;业务负责人＋平台团队&quot;,&quot;roles&quot;:[],&quot;features&quot;:[&quot;旧版、新版与基线对比&quot;,&quot;失败场景和权限回归&quot;,&quot;效果收益与资源代价&quot;,&quot;确定可发布范围&quot;],&quot;output&quot;:&quot;发布决定、限定范围和回退条件。&quot;,&quot;manual&quot;:&quot;比较评测、审查工具/权限变化，决定发布或退回。&quot;,&quot;ai&quot;:&quot;可整理报告，不决定自己的上线资格。&quot;},{&quot;id&quot;:&quot;M5&quot;,&quot;name&quot;:&quot;受控发布与回滚&quot;,&quot;label&quot;:&quot;版本与发布服务&quot;,&quot;roles&quot;:[],&quot;features&quot;:[&quot;灰度任务与版本绑定&quot;,&quot;角色、模型和工具快照&quot;,&quot;异常暂停与版本回退&quot;,&quot;保留旧任务复现能力&quot;],&quot;output&quot;:&quot;发布、灰度、回滚和依赖记录。&quot;,&quot;manual&quot;:&quot;授权发布、灰度观察、回滚；确认正在运行任务如何处理。&quot;,&quot;ai&quot;:&quot;仅调用已经授权的操作，不能隐式替换运行中任务的方法。&quot;},{&quot;id&quot;:&quot;M6&quot;,&quot;name&quot;:&quot;运行反馈与持续迭代&quot;,&quot;label&quot;:&quot;T-A2 辅助＋平台团队&quot;,&quot;roles&quot;:[&quot;T-A2&quot;],&quot;features&quot;:[&quot;任务成功率和人工返工&quot;,&quot;工具故障、成本和延迟&quot;,&quot;用户纠错与数据分布变化&quot;,&quot;形成下一轮方法改进&quot;],&quot;output&quot;:&quot;方法改进任务、监测记录与新评测候选。&quot;,&quot;manual&quot;:&quot;查看运行统计，选改进方向，审核反馈与方法建议。&quot;,&quot;ai&quot;:&quot;聚合失败模式和改进建议，不把线上回答自动写成训练真值。&quot;}]}],&quot;diagrams&quot;:{&quot;data&quot;:&quot;\u003csvg xmlns=\&quot;http://www.w3.org/2000/svg\&quot; width=\&quot;1680\&quot; height=\&quot;1060\&quot; viewBox=\&quot;0 0 1680 1060\&quot; role=\&quot;img\&quot;&gt;\n\u003ctitle&gt;数据资源平台\u003c/title&gt;\u003cdesc&gt;D1 需求与接入方案 → D2 采集与归档 → D3 清洗与加工 → D4 质量与时点核验 → D5 版本发布；D6 持续维护在发布后循环运行。；各支骨列出功能和责任角色，详细输入输出见配套说明。\u003c/desc&gt;\n\u003crect width=\&quot;1680\&quot; height=\&quot;1060\&quot; fill=\&quot;#FFFFFF\&quot;/&gt;\n\u003ctext x=\&quot;48.00\&quot; y=\&quot;35.00\&quot; dominant-baseline=\&quot;text-before-edge\&quot; font-family=\&quot;Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif\&quot; font-size=\&quot;43\&quot; font-weight=\&quot;600\&quot; fill=\&quot;#272332\&quot;&gt;01  数据资源平台\u003c/text&gt;\n\u003ctext x=\&quot;1390.00\&quot; y=\&quot;48.00\&quot; dominant-baseline=\&quot;text-before-edge\&quot; font-family=\&quot;Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif\&quot; font-size=\&quot;23\&quot; font-weight=\&quot;400\&quot; fill=\&quot;#625D6C\&quot;&gt;设计评审 · V2\u003c/text&gt;\n\u003ctext x=\&quot;48.00\&quot; y=\&quot;105.00\&quot; dominant-baseline=\&quot;text-before-edge\&quot; font-family=\&quot;Microsoft YaHei, Noto Sans CJK SC, Ping
