[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svquant"
version = "0.1.0"
description = "一站式 AI 量化投研平台 - QuantCore + ResearchEngine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SVQuant" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "matplotlib>=3.7",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
akshare = ["akshare>=1.10"]
clickhouse = ["clickhouse-driver>=0.2"]
numba = ["numba>=0.58"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
test = ["pytest>=7.0"]
all = [
    "akshare>=1.10",
    "clickhouse-driver>=0.2",
    "numba>=0.58",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
svquant-factor-backtest-batch = "app.cli.factor_backtest_batch:main"

[tool.setuptools.packages.find]
# 全仓只发布 ResearchEngine/app 下的 app.* 命名空间
where = ["ResearchEngine"]

[tool.setuptools.package-data]
app = [
    "assets/**/*.yaml",
    "assets/**/*.py",
    "assets/**/*.md",
]

[tool.pytest.ini_options]
testpaths = ["ResearchEngine/tests"]
python_files = ["test_*.py"]
